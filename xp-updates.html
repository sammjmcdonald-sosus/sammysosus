
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XP Leaderboard | SAMMY SOSUS</title>

  <style>
    :root {
      --cubs-blue: #0E3386;
      --cubs-red: #CC3433;
      --white: #FFFFFF;
      --muted: #C6D3ED;
      --track: #071D4F;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cubs-blue);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      border-bottom: 2px solid var(--cubs-red);
    }

    .brand {
      margin: 0;
      font-family: Impact, Haettenschweiler,
        "Arial Narrow Bold", sans-serif;
      font-size: clamp(27px, 5vw, 42px);
      letter-spacing: 3px;
    }

    .brand span {
      color: var(--cubs-red);
      -webkit-text-stroke: 1px var(--white);
    }

    .back-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--white);
      font-size: 11px;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover {
      color: var(--cubs-red);
    }

    main {
      width: min(100% - 32px, 780px);
      margin: 0 auto;
      padding: 45px 0 70px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #FF7777;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-family: Impact, Haettenschweiler,
        "Arial Narrow Bold", sans-serif;
      font-size: clamp(38px, 8vw, 58px);
      font-weight: normal;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 12px 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .update-date {
      display: inline-block;
      margin-bottom: 28px;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .update-date strong {
      color: #FFFFFF;
    }

    .leaderboard-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .leaderboard-heading h3 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .leaderboard-heading span {
      color: var(--muted);
      font-size: 11px;
    }

    .member {
      padding: 17px 16px;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 3px;
    }

    .member-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .member-name {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .rank {
      width: 27px;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .name {
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .xp {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    .xp span {
      color: var(--muted);
      font-size: 10px;
      font-weight: normal;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      overflow: hidden;
      background: var(--track);
      border-radius: 2px;
    }

    .progress-fill {
      height: 100%;
      width: var(--progress);
      background: var(--cubs-red);
      border-right: 2px solid var(--white);
      border-radius: 2px;
    }

    .member-bottom {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 10px;
    }

    .member:first-child {
      border-color: rgba(255, 255, 255, 0.45);
    }

    .member:first-child .rank {
      color: #FF7777;
    }

    .member:first-child .progress-fill {
      background: var(--white);
    }

    .scale-note {
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    footer {
      padding: 24px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 3px;
      text-align: center;
    }

    .progress-track {
  position: relative;
    }
    
    .prestige-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cubs-red);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 2;
    }
    
    .member.prestiged .progress-fill {
      background: var(--white);
      border-right: none;
    }
    
    .member.prestiged {
      border-color: var(--cubs-red);
    }

          
      /* =================================
         PRESTIGED — GOLD STATUS
      ================================= */
      
      .member.prestiged {
        border: 1px solid #F5C542;
        background: linear-gradient(
          110deg,
          rgba(120, 85, 0, 0.20),
          rgba(255, 215, 80, 0.12),
          rgba(120, 85, 0, 0.20)
        );
        box-shadow:
          0 0 12px rgba(255, 196, 0, 0.25),
          inset 0 0 12px rgba(255, 215, 80, 0.08);
      }
      
      .member.prestiged .rank {
        color: #FFD75E;
      }
      
      .member.prestiged .progress-track {
        position: relative;
        height: 34px;
        overflow: hidden;
        background: #382900;
        border: 1px solid #F5C542;
        border-radius: 3px;
        box-shadow: 0 0 10px rgba(255, 196, 0, 0.3);
      }
      
      .member.prestiged .progress-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(
          110deg,
          #8A5A00 0%,
          #D49B16 20%,
          #FFF1A6 38%,
          #F5C542 50%,
          #FFE58A 65%,
          #A66E00 85%,
          #FFD75E 100%
        );
        background-size: 250% 100%;
        animation: goldShimmer 3s linear infinite;
        border: none;
      }
      
      .prestige-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      
        color: #241900;
        font-size: 17px;
        font-weight: 1000;
        letter-spacing: 5px;
        text-transform: uppercase;
      
        text-shadow: 0 1px 1px rgba(255,255,255,0.4);
        pointer-events: none;
      }
      
      @keyframes goldShimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -150% 0;
        }
      }


    @media (max-width: 420px) {
      main {
        width: calc(100% - 22px);
        padding-top: 32px;
      }

      .member {
        padding: 14px 11px;
      }

      .name {
        font-size: 13px;
      }

      .xp {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 class="brand">SAMMY SOSUS <span>21</span></h1>
    <a class="back-link" href="home.html">
      &larr; Back to home
    </a>
  </header>

  <main>
    <p class="eyebrow">Fantasy League Tracker</p>
    <h2>XP Leaderboard</h2>

    <p class="subtitle">
      The chase for prestige and premium skins.
    </p>

    <!-- UPDATE THIS DATE WHEN YOU UPDATE THE XP -->
    <div class="update-date">
      Last Updated: <strong>03/11/2026</strong>
    </div>

    <div class="leaderboard-heading">
      <h3>League Standings</h3>
      <span>Target: 10,000 XP</span>
    </div>

    <!-- LEADERBOARD MEMBERS ARE GENERATED AUTOMATICALLY -->
    <div id="leaderboard"></div>

    <p class="scale-note">
      Progress is measured against the 10,000 XP target.
      Standings reflect the last update date shown above.
    </p>
  </main>

  <footer>
    SAMMY SOSUS &bull; 21
  </footer>

  <script>
    // ==========================================
    // ONLY UPDATE THE XP NUMBERS BELOW EACH WEEK
    // ==========================================

    const members = [
      { name: "AC2", xp: 7850 },
      { name: "DM",  xp: 11000 },
      { name: "MI",  xp: 7250 },
      { name: "MMc", xp: 7950 },
      { name: "FBG", xp: 5250 },
      { name: "DD",  xp: 5500 },
      { name: "TC",  xp: 4000 },
      { name: "CS",  xp: 3000 },
      { name: "BN",  xp: 3500 },
      { name: "TM",  xp: 4300 },
      { name: "DJK", xp: 3250 },
      { name: "RD",  xp: 2600 },
      { name: "SP",  xp: 2750 },
      { name: "MTCH",  xp: 3850 }
    ];

    // ==========================================
    // LEAVE EVERYTHING BELOW THIS LINE ALONE
    // ==========================================

    const targetXP = 10000;
    const leaderboard = document.getElementById("leaderboard");

    // Sort from highest XP to lowest XP.
    // If XP is tied, the original order is retained.
    const sortedMembers = [...members].sort((a, b) => b.xp - a.xp);

    const formatXP = (value) =>
      Math.round(value).toLocaleString("en-CA");

    sortedMembers.forEach((member, index) => {
      const rank = String(index + 1).padStart(2, "0");

      const percentage = (member.xp / targetXP) * 100;
      const progress = Math.min(percentage, 100);
      const remaining = Math.max(targetXP - member.xp, 0);

      const card = document.createElement("section");
      card.className = "member";
                 if (member.xp >= targetXP) {
        card.classList.add("prestiged");
      }

      card.innerHTML = `
        <div class="member-top">
          <div class="member-name">
            <span class="rank">${rank}</span>
            <span class="name">${member.name}</span>
          </div>

          <div class="xp">
            ${formatXP(member.xp)} <span>XP</span>
          </div>
        </div>

        
      <div class="progress-track">
        <div
          class="progress-fill"
          style="--progress: ${progress}%"
        ></div>
      
        ${member.xp >= targetXP
          ? '<div class="prestige-label">PRESTIGED</div>'
          : ''}
      </div>


        <div class="member-bottom">
          <span>${Number(percentage.toFixed(1))}% complete</span>
          <span>${formatXP(remaining)} XP remaining</span>
        </div>
      `;

      leaderboard.appendChild(card);
    });
  </script>

</body>
</html>
