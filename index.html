
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sammy Sosus | Number 21</title>

  <!-- Free athletic-style condensed font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --jersey-blue: #003DA5;
      --jersey-red: #D71920;
      --jersey-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #002d7d;
      font-family: "Roboto Condensed", Impact, sans-serif;
    }

    /* Blue jersey fabric */
    .jersey {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 30px 12px 50px;
      overflow: hidden;

      background-color: var(--jersey-blue);

      /* Soft lighting and subtle woven texture */
      background-image:
        radial-gradient(
          ellipse at 50% 35%,
          rgba(65, 125, 220, 0.35),
          transparent 68%
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 3px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.035) 0px,
          rgba(0, 0, 0, 0.035) 1px,
          transparent 1px,
          transparent 4px
        );

      box-shadow: inset 0 0 100px rgba(0, 15, 65, 0.3);
    }

    /* Gentle fabric shading along the edges */
    .jersey::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.13),
          transparent 18%,
          transparent 82%,
          rgba(0, 0, 0, 0.13)
        );
    }

    .design {
      width: min(100%, 760px);
      text-align: center;
      transform: translateY(-8px);
    }

    /* SVG gives the name a smooth, continuous arch */
    .arched-name {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      margin: 0 auto -2%;
    }

    .name-text {
      font-family: "Roboto Condensed", Impact, sans-serif;
      font-size: 68px;
      font-weight: 900;
      letter-spacing: 3px;
      fill: var(--jersey-red);
      stroke: var(--jersey-white);
      stroke-width: 1.8px;
      paint-order: stroke fill;
      stroke-linejoin: round;
    }

    /* Oversized athletic jersey number */
    .number {
      display: block;
      margin-top: -1%;
      color: var(--jersey-red);
      font-family: "Roboto Condensed", Impact, sans-serif;
      font-size: clamp(210px, 46vw, 390px);
      font-weight: 900;
      line-height: 0.98;
      letter-spacing: -0.065em;
      padding-right: 0.065em;

      -webkit-text-stroke: 5px var(--jersey-white);
      paint-order: stroke fill;

      text-shadow:
        2px 3px 0 rgba(0, 0, 0, 0.18),
        0 0 1px rgba(255, 255, 255, 0.3);
    }

    /* Fine, low-contrast jersey seam */
    .seam {
      width: 34%;
      height: 1px;
      margin: 18px auto 0;
      background: rgba(255, 255, 255, 0.12);
    }

    
@media (max-width: 480px) {
  .jersey {
    min-height: 100svh;
    padding: 24px 16px;
    overflow: visible;
  }

  .design {
    width: 100%;
    max-width: 420px;
    transform: none;
  }

  .arched-name {
    width: 100%;
    height: auto;
    margin-bottom: 4px;
  }

  .name-text {
    font-size: 68px;
    letter-spacing: 1px;
    stroke-width: 1.5px;
  }

  .number {
    font-size: clamp(150px, 44vw, 220px);
    letter-spacing: -0.04em;
    padding-right: 0.04em;
    -webkit-text-stroke-width: 3px;
    line-height: 1;
  }

  .seam {
    margin-top: 12px;
  }
}

      }
    }
  </style>
</head>

<body>
  <main class="jersey">
    <div class="design">

      <!-- The letters follow a smooth curved path -->
      <svg
        class="arched-name"
        viewBox="0 0 900 205"
        role="img"
        aria-label="SAMMY SOSUS"
      >
        <defs>
          <path
            id="name-arc"
            d="M 65,155 Q 450,-45 835,155"
          />
        </defs>

        <text
          class="name-text"
          text-anchor="middle"
        >
          <textPath
            href="#name-arc"
            startOffset="50%"
            textLength="690"
            lengthAdjust="spacingAndGlyphs"
          >SAMMY SOSUS</textPath>
        </text>
      </svg>

      <div class="number" aria-label="Number 21">21</div>

      <div class="seam"></div>
    </div>
  </main>
</body>
</html>
