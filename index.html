
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMMY SOSUS #21</title>

  <style>
    :root {
      --cubs-blue: #0E3386;
      --cubs-red: #CC3433;
      --jersey-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cubs-blue);
      color: var(--jersey-white);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold",
        sans-serif;
    }

    .landing {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .jersey {
      width: min(100%, 650px);
      overflow: visible;
    }

    .name {
      fill: var(--jersey-white);
      stroke: var(--cubs-red);
      stroke-width: 1.5px;
      paint-order: stroke fill;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold",
        sans-serif;
      font-size: 35px;
      letter-spacing: 2px;
    }

    .number {
      fill: var(--jersey-white);
      stroke: var(--cubs-red);
      stroke-width: 5px;
      paint-order: stroke fill;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold",
        sans-serif;
      font-size: 235px;
      letter-spacing: -8px;
    }

    .teaser {
      margin-top: 55px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(13px, 2vw, 17px);
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: lowercase;
      color: var(--jersey-white);
    }

    @media (max-width: 480px) {
      .name {
  fill: var(--cubs-red);
  stroke: var(--jersey-white);
  stroke-width: 2px;
  paint-order: stroke fill;
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold",
    sans-serif;
  font-size: 35px;
  letter-spacing: 2px;
}

.number {
  fill: var(--cubs-red);
  stroke: var(--jersey-white);
  stroke-width: 5px;
  paint-order: stroke fill;
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold",
    sans-serif;
  font-size: 235px;
  letter-spacing: -8px;
}
      .teaser {
        margin-top: 35px;
        letter-spacing: 3px;
      }
    }
  </style>
</head>

<body>
  <main class="landing">
    <svg
      class="jersey"
      viewBox="0 0 600 330"
      role="img"
      aria-label="SAMMY SOSUS, number 21"
    >
      <defs>
        <path
          id="name-arc"
          d="M 65,145 Q 300,-10 535,145"
          fill="none"
        />
      </defs>

      <text class="name" text-anchor="middle">
        <textPath
          href="#name-arc"
          startOffset="50%"
        >SAMMY SOSUS</textPath>
      </text>

      <text
        class="number"
        x="300"
        y="300"
        text-anchor="middle"
      >21</text>
    </svg>

    <p class="teaser">in the on deck circle...</p>
  </main>
</body>
</html>
