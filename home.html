
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMMY SOSUS #21</title>

  <style>
    :root {
      --cubs-blue: #0E3386;
      --cubs-red: #CC3433;
      --jersey-white: #FFFFFF;
      --purple: #8000FF;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold",
        sans-serif;
    }

    .xp-link {
      display: inline-block;
      margin-top: 32px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 3px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .xp-link:hover {
      color: #CC3433;
    }

    /* SAMMY SOSUS HOME PAGE */

    #home-screen {
      min-height: 100vh;
      background: var(--cubs-blue);
      color: var(--jersey-white);
    }

    .landing {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .jersey {
      display: block;
      width: min(100%, 650px);
      overflow: visible;
    }

    .name {
      fill: var(--cubs-red);
      stroke: var(--jersey-white);
      stroke-width: 2px;
      paint-order: stroke fill;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold",
        sans-serif;
      font-size: 35px;
      letter-spacing: 2px;
    }

    .number {
      fill: var(--cubs-red);
      stroke: var(--jersey-white);
      stroke-width: 5px;
      paint-order: stroke fill;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold",
        sans-serif;
      font-size: 235px;
      letter-spacing: -8px;
    }

    .teaser {
      margin-top: 55px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(13px, 2vw, 17px);
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: lowercase;
      color: var(--jersey-white);
    }

    @media (max-width: 480px) {
      .name {
        font-size: 32px;
      }

      .number {
        font-size: 210px;
      }

      .teaser {
        margin-top: 35px;
        letter-spacing: 3px;
      }
    }

    /* RANDOM PURPLE GAHOO ENTRY SQUARE */

    #entry-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }

    #secret-square {
      position: absolute;
      display: block;
      width: 13px;
      height: 13px;
      background: var(--purple);
      border: none;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
      text-decoration: none;
      transition: transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    #secret-square:hover {
      background: #A64DFF;
      transform: scale(1.4);
      box-shadow: 0 0 12px rgba(128, 0, 255, 0.8);
    }

    #secret-square:focus-visible {
      outline: 2px solid white;
      outline-offset: 5px;
    }

  </style>
</head>

<body>

  <!-- MAIN HOME PAGE -->

  <main id="home-screen">
    <section class="landing">

      <svg
        class="jersey"
        viewBox="0 0 600 330"
        role="img"
        aria-label="SAMMY SOSUS, number 21"
      >
        <defs>
          <path
            id="name-arc"
            d="M 65,145 Q 300,-10 535,145"
            fill="none"
          />
        </defs>

        <text class="name" text-anchor="middle">
          <textPath
            href="#name-arc"
            startOffset="50%"
          >SAMMY SOSUS</textPath>
        </text>

        <text
          class="number"
          x="300"
          y="300"
          text-anchor="middle"
        >21</text>
      </svg>

      <p class="teaser">in the on deck circle...</p>

      <a href="xp-updates.html" class="xp-link">XP Updates</a>

      <a href="pension.html" class="xp-link">Pension</a>

    </section>
  </main>

  <!-- RANDOM PURPLE SQUARE -->
  <!-- Clicking it opens gahoo.html -->

  <div id="entry-screen">
    <a
      href="gahoo.html"
      id="secret-square"
      aria-label="Enter Gahoo Gang Hideout"
      title="Enter"
    ></a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const square = document.getElementById("secret-square");

      const size = 13;
      const padding = 25;
      const safeGap = 20;

      function positionSquare() {

        // Protect the main lettering and homepage links.
        const protectedElements = document.querySelectorAll(
          ".jersey, .teaser, .xp-link"
        );

        const protectedAreas = Array.from(protectedElements).map(element => {
          const rect = element.getBoundingClientRect();

          return {
            left: rect.left - safeGap,
            right: rect.right + safeGap,
            top: rect.top - safeGap,
            bottom: rect.bottom + safeGap
          };
        });

        function overlaps(x, y, area) {
          return (
            x < area.right &&
            x + size > area.left &&
            y < area.bottom &&
            y + size > area.top
          );
        }

        let x;
        let y;
        let foundPosition = false;

        // Try up to 1000 random positions.
        for (let attempt = 0; attempt < 1000; attempt++) {

          const availableWidth = Math.max(
            0,
            window.innerWidth - size - padding * 2
          );

          const availableHeight = Math.max(
            0,
            window.innerHeight - size - padding * 2
          );

          x = padding + Math.random() * availableWidth;
          y = padding + Math.random() * availableHeight;

          const blocked = protectedAreas.some(area =>
            overlaps(x, y, area)
          );

          if (!blocked) {
            foundPosition = true;
            break;
          }
        }

        if (foundPosition) {
          square.style.display = "block";
          square.style.left = x + "px";
          square.style.top = y + "px";
        } else {
          square.style.display = "none";
        }
      }

      // Pick a random location when the page loads.
      positionSquare();

      // Reposition if the browser window changes size.
      window.addEventListener("resize", positionSquare);

    });
  </script>

</body>
</html>
