
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pension | SAMMY SOSUS 21</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0E3386;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      border-bottom: 3px solid #CC3433;
    }

    .brand {
      margin: 0;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(38px, 8vw, 64px);
      letter-spacing: 3px;
      line-height: 1;
      color: #CC3433;
      -webkit-text-stroke: 1.5px white;
      text-shadow: 3px 3px 0 #071D49;
    }

    .brand span {
      display: inline-block;
      margin-left: 8px;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: white;
      font-size: 12px;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover {
      color: #CC3433;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    .eyebrow {
      color: #CC3433;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0 0 30px;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(32px, 6vw, 46px);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .info-card {
      background: #09265F;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-left: 5px solid #CC3433;
      padding: 28px 24px;
      text-align: left;
    }

    .info-card p {
      margin: 0;
      font-size: 16px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <header>
    <h1 class="brand">SAMMY SOSUS <span>21</span></h1>
    <a href="home.html" class="back-link">← Back to Home</a>
  </header>

  <main>
    <div class="eyebrow">League Information</div>
    <h2>Pension</h2>

    <div class="info-card">
      <p>Important information about league pension to be announced</p>
    </div>
  </main>
</body>
</html>
