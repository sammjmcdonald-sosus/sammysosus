
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pension | SAMMY SOSUS</title>

  <style>
    :root {
      --cubs-blue: #0E3386;
      --cubs-red: #CC3433;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cubs-blue);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      border-bottom: 2px solid var(--cubs-red);
    }

    .brand {
      margin: 0;
      font-family: Impact, Haettenschweiler,
        "Arial Narrow Bold", sans-serif;
      font-size: clamp(27px, 5vw, 42px);
      letter-spacing: 3px;
    }

    .brand span {
      color: var(--cubs-red);
      -webkit-text-stroke: 1px var(--white);
    }

    .back-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--white);
      font-size: 11px;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover {
      color: var(--cubs-red);
    }

    main {
      width: min(100% - 32px, 780px);
      margin: 0 auto;
      padding: 45px 0 70px;
      text-align: center;
    }

    h2 {
      margin: 0;
      color: var(--white);
      font-family: Impact, Haettenschweiler,
        "Arial Narrow Bold", sans-serif;
      font-size: clamp(16px, 4vw, 24px);
      font-weight: normal;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      main {
        width: calc(100% - 22px);
        padding-top: 32px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 class="brand">SAMMY SOSUS <span>21</span></h1>
    <a class="back-link" href="home.html">
      &larr; Back to home
    </a>
  </header>

  <main>
    <h2>Under Construction</h2>
  </main>

</body>
</html>
