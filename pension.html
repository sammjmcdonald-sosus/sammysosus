
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pension | SAMMY SOSUS</title>

  <style>
    :root {
      --cubs-blue: #0E3386;
      --cubs-red: #CC3433;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cubs-blue);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      border-bottom: 2px solid var(--cubs-red);
    }

    .brand {
      margin: 0;
      font-family: Impact, Haettenschweiler,
        "Arial Narrow Bold", sans-serif;
      font-size: clamp(27px, 5vw, 42px);
      letter-spacing: 3px;
    }

    .brand span {
      color: var(--cubs-red);
      -webkit-text-stroke: 1px var(--white);
    }

    .back-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--white);
      font-size: 11px;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover {
      color: var(--cubs-red);
    }

    main {
      width: min(100% - 32px, 780px);
      margin: 0 auto;
      padding: 20px 0 70px;
      text-align: center;
    }

    h2 {
      margin: 0;
      color: var(--white);
      font-family: Impact, Haettenschweiler,
        "Arial Narrow Bold", sans-serif;
      font-size: clamp(16px, 4vw, 24px);
      font-weight: normal;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
.pension-balance {
  margin: 36px auto 0;
  padding: 28px 20px;
  text-align: center;
}

.live-indicator {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: var(--white);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 3px;
}

.live-dot {
  width: 9px;
  height: 9px;
  display: inline-block;
  background: #FF3333;
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
  animation: live-pulse 1.2s infinite;
}

@keyframes live-pulse {
  0%, 100% {
    opacity: 1;
    box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
  }

  50% {
    opacity: 0.25;
    box-shadow: 0 0 2px rgba(255, 51, 51, 0.2);
  }
}

.balance-label {
  margin: 28px 0 8px;
  color: var(--white);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 4px;
}

.balance-amount {
  margin: 0;
  color: var(--white);
  font-family: Impact, Haettenschweiler,
    "Arial Narrow Bold", sans-serif;
  font-size: clamp(56px, 12vw, 88px);
  line-height: 1.15;
  letter-spacing: 2px;
}


    @media (max-width: 420px) {
      main {
        width: calc(100% - 22px);
        padding-top: 92px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 class="brand">SAMMY SOSUS <span>21</span></h1>
    <a class="back-link" href="home.html">
      &larr; Back to home
    </a>
  </header>

  <main>
    
<main>

  <section class="pension-balance">
    <div class="live-indicator">
      <span class="live-dot"></span>
      <span>LIVE</span>
    </div>

    <p class="balance-label">CURRENT BALANCE</p>

    <p class="balance-amount">$54.38</p>
    
  </section>
</main>

  </main>

</body>
</html>
